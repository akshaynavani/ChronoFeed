# ChronoFeed runtime configuration.
# Secrets (MQTT password) are NOT stored here; set CHRONOFEED_MQTT_PASSWORD instead.

log_level = info

mqtt.host = 127.0.0.1
mqtt.port = 1883
mqtt.client_id = chronofeed-node-1
mqtt.topic = sensors/#
mqtt.keepalive_s = 30
mqtt.reconnect_backoff_ms = 500

# Real-time scheduling. Leave CPU 0 for the kernel / housekeeping.
rt.enable_fifo = true
rt.lock_memory = true
rt.busy_poll = true
rt.idle_sleep_us = 20
rt.ingest_cpu = 1
rt.process_cpu = 2
rt.sink_cpu = 3
rt.ingest_priority = 80
rt.process_priority = 75
rt.sink_priority = 60

ntp.enabled = true
ntp.server = pool.ntp.org
ntp.port = 123
ntp.poll_interval_s = 16
ntp.timeout_ms = 500
ntp.kp = 0.7
ntp.ki = 0.05
ntp.max_step_ms = 128

# End-to-end deadline from socket receipt to sink, in microseconds.
pipeline.deadline_us = 5000
pipeline.ring_capacity = 4096
pipeline.ema_alpha = 0.2
pipeline.value_min = -1000000
pipeline.value_max = 1000000
pipeline.sink_path = -
pipeline.report_interval_s = 5
